name: Bug Report
description: Report a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What actually happens.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen instead.
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: Optional — skip if the current behavior already makes it obvious.
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
    validations:
      required: false

  - type: textarea
    id: additional-info
    attributes:
      label: Additional information
      description: Optional — anything else that helps narrow it down.
      placeholder: |
        - Affected area (page, component, file)
        - Error messages, logs or console output (in code blocks)
        - Environment (browser, OS, version, branch)
        - Screenshots
    validations:
      required: false
