name: Feature Request
description: Propose a new feature or idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What's missing or painful, and who runs into it? Focus on the "why", not the "how".
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements & constraints (optional)
      description: What should the result do? Anything it must respect or explicitly not do? A rough solution idea is welcome; leave this empty if you want the plan to propose one.
    validations:
      required: false
